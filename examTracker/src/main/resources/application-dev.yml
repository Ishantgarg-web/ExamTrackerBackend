spring:
  google:
    oauth:
      client_id: ${CLIENT_ID}
      client_secret: ${CLIENT_SECRET}
      redirect_uri: ${SPRING_GOOGLE_OAUTH_REDIRECT_URI}
      response_cookie: ${SPRING_GOOGLE_OAUTH_RESPONSE_COOKIE}
  datasource:
    url: jdbc:mysql://localhost:3306/${DATABASE_NAME}?createDatabaseIfNotExist=true
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  auth:
    access:
      token:
        cookie:
          name: ${SPRING_AUTH_ACCESS_TOKEN_COOKIE_NAME}
  domain_name: ${SPRING_CORS_FRONT_END_DOMAIN_NAME}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
jwt:
  secret: ${JWT_SECRET}
server:
  port: 8000
