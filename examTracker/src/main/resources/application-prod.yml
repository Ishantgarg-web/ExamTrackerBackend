spring:
  google:
    oauth:
      client_id: ${CLIENT_ID}
      client_secret: ${CLIENT_SECRET}
      redirect_uri: ${SPRING_GOOGLE_OAUTH_REDIRECT_URI}
      response_cookie: ${SPRING_GOOGLE_OAUTH_RESPONSE_COOKIE}
  datasource:
    url: ${DB_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  auth:
    access:
      token:
        cookie:
          name: ${SPRING_AUTH_ACCESS_TOKEN_COOKIE_NAME}
  domain_name: ${SPRING_DOMAIN_NAME}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  secret: ${JWT_SECRET}

server:
  port: 8080
